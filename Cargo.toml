[package]
name = "invoicemd-cli"
version = "0.1.0"
edition = "2021"
description = "Generate HTML and PDF invoices from YAML using Tera templates"
readme = "README.md"
license = "MIT"
repository = "https://github.com/rconnelly/invoicemd-cli"
homepage = "https://github.com/rconnelly/invoicemd-cli"
keywords = ["invoice", "yaml", "html", "pdf", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.88"
build = "build.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
printpdf = "0.12"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = "1.20"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
jsonschema = { version = "0.52.1", default-features = false }
predicates = "3.1"
tempfile = "3.14"
