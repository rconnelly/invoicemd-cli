name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata files
        run: |
          test -f CHANGELOG.md
          test -f RELEASING.md
          test -f .releaserc.json
          test -f package.json
          test -f scripts/prepare-release.py
          grep -q '^version = ' Cargo.toml
          cargo metadata --format-version 1 --no-deps | jq -e '.packages[] | select(.name=="invoicemd-cli") | .version'
